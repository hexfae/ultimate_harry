[package]
name = "ultimate_config"
version = "0.0.3"
edition = "2024"

[dependencies]
parking_lot = "0.12.3"
notify = "8.0.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.10"
miette = "7.5.0"
snafu = "0.8.5"
tracing = "0.1.41"
serenity = "0.12.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
