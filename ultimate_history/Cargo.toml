[package]
name = "ultimate_history"
version = "0.0.6"
edition = "2024"

[dependencies]
ultimate_message = { path = "../ultimate_message" }
ultimate_character = { path = "../ultimate_character" }
serenity = "0.12.4"
snafu = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
async-openai = "0.28.1"
surrealdb = "2.3.1"
nonempty = { version = "0.11.0", features = ["serialize"] }
bon = "3.6.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
