[package]
name = "ultimate_character"
version = "0.0.10"
edition = "2024"

[dependencies]
bon = "3.5.1"
jiff = { version = "0.2.5", features = ["serde"] }
poise = "0.6.1"
serde = { version = "1.0.219", features = ["derive"] }
ulid = { version = "1.2.1", features = ["serde"] }
ultimate_config = { path = "../ultimate_config" }
ultimate_phrases = { path = "../ultimate_phrases" }
ultimate_modals = { path = "../ultimate_modals" }
url = "2.5.4"
surrealdb = "2.3.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
missing-errors-doc = "allow"                 # TODO: remove
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
