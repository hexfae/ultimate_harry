[package]
name = "ultimate_harry"
version = "0.0.8"
edition = "2024"

[[bin]]
name = "harry"
path = "src/main.rs"

[dependencies]
poise = { git = "https://github.com/serenity-rs/poise.git", branch = "next" }
tokio = { version = "1.45.0", features = ["rt-multi-thread"] }
ulid = "1.2.1"
ultimate_character = { path = "../ultimate_character" }
ultimate_message = { path = "../ultimate_message" }
ultimate_config = { path = "../ultimate_config" }
ultimate_statistics = { path = "../ultimate_statistics" }
ultimate_phrases = { path = "../ultimate_phrases" }
ultimate_modals = { path = "../ultimate_modals" }
ultimate_history = { path = "../ultimate_history" }
ultimate_requester = { path = "../ultimate_requester" }
ultimate_database = { path = "../ultimate_database" }
nanorand = "0.7.0"
snafu = "0.8.5"
miette = { version = "7.6.0", features = ["fancy"] }
surrealdb = "2.3.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
