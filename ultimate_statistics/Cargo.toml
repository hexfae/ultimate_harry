[package]
name = "ultimate_statistics"
version = "0.0.3"
edition = "2024"

[dependencies]
dashmap = { version = "6.1.0", features = ["serde"] }
miette = "7.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serenity = "0.12.4"
snafu = "0.8.5"
toml = "0.8.20"
tracing = "0.1.41"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
