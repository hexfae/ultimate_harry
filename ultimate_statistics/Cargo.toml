[package]
name = "ultimate_statistics"
version = "0.0.3"
edition = "2024"

[dependencies]
dashmap = { version = "7.0.0-rc2", features = ["serde"] }
miette = "7.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serenity = { git = "https://github.com/serenity-rs/serenity.git", branch = "next" }
snafu = "0.9.0"
toml = "1.0.6"
tracing = "0.1.44"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
