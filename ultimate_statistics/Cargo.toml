[package]
name = "ultimate_statistics"
version = "0.0.2"
edition = "2024"

[dependencies]
dashmap = "6.1.0"
miette = "7.5.0"
parking_lot = "0.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serenity = "0.12.4"
snafu = "0.8.5"
toml = "0.8.20"
tracing = "0.1.41"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
missing-errors-doc = "allow"                 # TODO: remove
enum_glob_use = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
